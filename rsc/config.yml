# workers: 4
paths: []
# extract: false
# extract_workers: 2
# max_file_size: 100MiB
# recursive_extract_max_depth: 10
# recursive_extract_max_size: 5GB
# recursive_extract_max_files: 10000
actions:
  delete: true
  quarantine: true
  move: false
monitoring:
  prescan: true
  period: 1h
  modification_delay: 30s
gmalware_api_url: https://gmalware.ggp.glimps.re
gmalware_api_token: 00000000-00000000-00000000-00000000-00000000
gmalware_timeout: 5m
gmalware_user_tags: ["Server1"]
gmalware_no_cert_check: false
# gmalware_syndetect: false
# gmalware_bypass_cache: false
quarantine:
  # location: "C:\\Program Files\\GMHost\\quarantine"
  password: infected
# plugins_config: /etc/gmhost/plugins.yml

# Path rules, applied by the connector to the logical path of every file and archive member
# (Go regular expressions; they replace the removed filepath_filter plugin). A forbidden path
# is treated as malware; a skipped path is delivered without analysis. Anchor the skipped
# paths on folders depositors cannot create: they choose the names of their files and members.
# filepath_filter:
#   forbidden_paths:
#     - '\.exe[^/]*$'
#   skipped_paths:
#     - '^/srv/in/trusted/'
# What the removed error_filter plugin did (quarantine the files whose analysis fails):
# unanalyzable_policy:
#   analysis_error: mitigate
# debug: false

# Time allowed to stop on SIGTERM or SIGINT (default 8s, at least 2s). Keep it under the
# delay of the orchestrator (`docker stop -t`, systemd `TimeoutStopSec`). Local to this
# machine: the console does not manage it.
# shutdown_timeout: 8s
